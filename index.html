<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>원룸관리</title>
<meta name="theme-color" content="#FFF9F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1A24" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDggMTA4Ij4KICA8Y2lyY2xlIGN4PSI1NCIgY3k9IjU0IiByPSI1NCIgZmlsbD0iIzFCNDMzMiIvPgogIDxwYXRoIGZpbGw9IiNmZmYiIGQ9Ik01NCwyMiBMODMsNDggTDI1LDQ4IFogTTMwLDQ4IGg0OCB2MzggaC00OCBaIi8+CiAgPHBhdGggZmlsbD0iIzFCNDMzMiIgZD0iTTQwLDU2IGgxMCB2MTAgaC0xMCBaIE01OCw1NiBoMTAgdjEwIGgtMTAgWiBNNDAsNzAgaDEwIHYxMCBoLTEwIFogTTU4LDcwIGgxMCB2MTAgaC0xMCBaIi8+Cjwvc3ZnPgo=" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  /* 암호 입력 화면 전용. 암호가 풀리면 body.locked가 사라지고 아래 #site-style에 본문 스타일이 들어간다. */
  body.locked {
    --paper: #FFF9F3; --ink: #3B3340; --muted: #6E6273; --sage: #4E7F78; --rose: #B8697A;
    --line: rgba(59, 51, 64, .14); --card: rgba(255, 255, 255, .8);
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    box-sizing: border-box;
    background: radial-gradient(60% 50% at 20% 10%, #FBDCCB 0, transparent 70%),
                radial-gradient(55% 45% at 85% 20%, #E6DEF6 0, transparent 70%),
                radial-gradient(60% 50% at 70% 95%, #D3EBE4 0, transparent 70%), var(--paper);
    color: var(--ink); font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    body.locked {
      --paper: #1E1A24; --ink: #EDE4EE; --muted: #CFC3D3; --sage: #A8D5CB; --rose: #F0B3C1;
      --line: rgba(237, 228, 238, .16); --card: rgba(51, 44, 60, .8);
      background: radial-gradient(60% 50% at 20% 10%, rgba(251, 220, 203, .12) 0, transparent 70%),
                  radial-gradient(55% 45% at 85% 20%, rgba(230, 222, 246, .12) 0, transparent 70%),
                  radial-gradient(60% 50% at 70% 95%, rgba(211, 235, 228, .12) 0, transparent 70%), var(--paper);
      color-scheme: dark;
    }
  }
  .gate { box-sizing: border-box; width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 28px;
          padding: 36px 28px 30px; text-align: center; box-shadow: 0 30px 60px -30px rgba(90, 60, 100, .45);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .gate img { width: 64px; height: 64px; margin: 0 auto 10px; display: block; }
  .gate h1 { margin: 0; font: 400 1.9rem/1.3 "Jua", "Gowun Dodum", system-ui, sans-serif; }
  .gate p { margin: 8px 0 22px; color: var(--muted); font-size: .98rem; line-height: 1.6; }
  .gate label { display: block; text-align: left; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  .gate input { width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--line);
                background: var(--paper); color: var(--ink); font-size: 1.1rem; letter-spacing: .08em; }
  .gate input:focus { outline: none; border-color: var(--sage); }
  .gate button { width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 999px; background: var(--sage);
                 color: var(--paper); font: 400 1.08rem "Jua", "Gowun Dodum", system-ui, sans-serif; cursor: pointer; }
  .gate button:disabled { opacity: .6; cursor: progress; }
  .gate .msg { min-height: 1.6em; margin: 14px 0 0; font-size: .92rem; }
  .gate .msg.error { color: var(--rose); }
</style>
<style id="site-style"></style>
</head>
<body class="locked">
<main class="gate">
  <form id="gate-form" autocomplete="on">
    <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDggMTA4Ij4KICA8Y2lyY2xlIGN4PSI1NCIgY3k9IjU0IiByPSI1NCIgZmlsbD0iIzFCNDMzMiIvPgogIDxwYXRoIGZpbGw9IiNmZmYiIGQ9Ik01NCwyMiBMODMsNDggTDI1LDQ4IFogTTMwLDQ4IGg0OCB2MzggaC00OCBaIi8+CiAgPHBhdGggZmlsbD0iIzFCNDMzMiIgZD0iTTQwLDU2IGgxMCB2MTAgaC0xMCBaIE01OCw1NiBoMTAgdjEwIGgtMTAgWiBNNDAsNzAgaDEwIHYxMCBoLTEwIFogTTU4LDcwIGgxMCB2MTAgaC0xMCBaIi8+Cjwvc3ZnPgo=" alt="">
    <h1>원룸관리</h1>
    <p>암호를 입력해야 볼 수 있는 페이지예요.</p>
    <label for="pw">암호</label>
    <input id="pw" name="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">들어가기</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(() => {
  // 페이지 본문과 APK는 이 암호로만 풀리도록 AES-256-GCM으로 암호화돼 있다(키 = PBKDF2-SHA256(암호, salt)).
  // 암호 자체는 어디에도 저장돼 있지 않다.
  const CONTENT_URL = "data/content-1.5.1.enc";
  const ITERATIONS = 600000;
  const MIME = { webp: "image/webp", png: "image/png", svg: "image/svg+xml", jpg: "image/jpeg" };

  const form = document.getElementById("gate-form");
  const input = document.getElementById("pw");
  const button = document.getElementById("go");
  const msg = document.getElementById("msg");
  let aesKey = null;

  function say(text, isError) { msg.textContent = text; msg.classList.toggle("error", !!isError); }

  async function deriveKey(password, salt) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }

  function showSite(page) {
    let style = page.style, body = page.body;
    for (const [name, b64] of Object.entries(page.images)) {
      const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type: MIME[name.split(".").pop()] || "application/octet-stream" }));
      style = style.split("assets/img/" + name).join(url);
      body = body.split("assets/img/" + name).join(url);
    }
    document.title = page.title;
    document.getElementById("site-style").textContent = style;
    document.body.className = "";
    document.body.innerHTML = body;
    if (location.hash) {
      const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) target.scrollIntoView();
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { say("이 브라우저에서는 열 수 없어요. 최신 Chrome으로 열어 주세요.", true); return; }
    button.disabled = true;
    say("확인 중…");
    try {
      const res = await fetch(CONTENT_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const buf = new Uint8Array(await res.arrayBuffer());
      const key = await deriveKey(input.value.trim(), buf.slice(0, 16));
      let plain;
      try {
        plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28));
      } catch (_) {
        say("암호가 올바르지 않아요.", true);
        input.select();
        return;
      }
      aesKey = key;
      showSite(JSON.parse(new TextDecoder().decode(plain)));
    } catch (err) {
      say("페이지를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.", true);
    } finally {
      button.disabled = false;
    }
  });

  // APK 다운로드: 암호화된 파일(…apk.enc)을 받아 같은 키로 풀어 저장한다.
  document.addEventListener("click", async (e) => {
    const link = e.target.closest && e.target.closest('a[href$=".apk"]');
    if (!link || !aesKey) return;
    e.preventDefault();
    if (link.dataset.busy) return;
    link.dataset.busy = "1";
    const original = link.innerHTML;
    link.innerHTML = original.replace("APK 다운로드", "내려받는 중…");
    try {
      const href = link.getAttribute("href");
      const res = await fetch(href + ".enc", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const buf = new Uint8Array(await res.arrayBuffer());
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, aesKey, buf.slice(12));
      const url = URL.createObjectURL(new Blob([plain], { type: "application/vnd.android.package-archive" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = href.split("/").pop();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (err) {
      alert("APK를 내려받지 못했어요. 잠시 후 다시 시도해 주세요.");
    } finally {
      link.innerHTML = original;
      delete link.dataset.busy;
    }
  });
})();
</script>
</body>
</html>
